<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIS</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --gray: #9ca3af; }
        body { margin: 0; background: #0b1015; color: #e5e7eb; font-family: system-ui, sans-serif; padding: 2rem; }
        .maps { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 3rem; }
        .map-section h2 { margin: 0 0 0.25rem; font-size: 1.5rem; }
        .map-section p { margin: 0 0 1rem; color: var(--gray); white-space: pre-line; }
        .image-container { position: relative; display: inline-block; }
        .image-container img { max-width: 100%; height: auto; display: block; }
        .image-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .rect { fill-opacity: 0.6; stroke-width: 2; pointer-events: all; }
        .rect.green { fill: var(--green); stroke: var(--green); }
        .rect.red { fill: var(--red); stroke: var(--red); }
        .rect.blue { fill: var(--blue); stroke: var(--blue); }
        .rect.gray { fill: var(--gray); stroke: var(--gray); }
        .label { font-size: 6px; fill: #fff; stroke: rgba(0,0,0,.6); stroke-width: 0; paint-order: stroke; pointer-events: none; }
        .progress-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; background: #1e293b; margin-bottom: 1rem; }
        .progress-bar span { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #fff; white-space: nowrap; transition: width 0.3s; }
        .progress-bar .bg-green { background: var(--green); }
        .progress-bar .bg-red { background: var(--red); }
        .progress-bar .bg-blue { background: var(--blue); }
        .progress-legend { display: flex; gap: 1.25rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: var(--gray); }
        .progress-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
        .expenses { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
        .expenses th, .expenses td { padding: 0.4rem 0.75rem; text-align: left; border-bottom: 1px solid #1e293b; }
        .expenses th { color: var(--gray); font-weight: 600; }
        .expenses tr:hover td { background: #1e293b; }
        .expenses .num { text-align: right; }
        .expenses-summary { display: flex; gap: 2rem; margin-top: 1rem; font-size: 0.9rem; }
        .expenses-summary span { color: var(--gray); }
        .expenses-summary strong { color: #e5e7eb; }
        .loading { color: var(--gray); font-style: italic; }
        .error { color: var(--red); }
    </style>
</head>
<body>
<div class="maps" id="maps">
    <p class="loading">Loading maps…</p>
</div>
<script>
    const docID = '2PACX-1vTLjPc5F4Jd6LHxDbj2sqrXzcmtkqoezYfAY-WAeVSzlI8DVa0_09urjJlEZe9pw_oeCgSepneiXQQ8';

    function sheetURL(fmt) {
        return `https://docs.google.com/spreadsheets/d/e/${docID}/pub?output=${fmt}`;
    }

    function parseSheetData(sheet) {
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        return rows.slice(1)
            .filter(r => r[0])
            .map(r => ({ addr: String(r[0]).trim(), flag: String(r[1] || '').trim().toUpperCase() }));
    }

    function parseIndex(sheet) {
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        return rows.slice(1)
            .filter(r => r[0])
            .map(r => ({
                sheet: String(r[0]).trim(),
                title: String(r[1] || '').trim(),
                description: String(r[2] || '').trim(),
                wydatki: String(r[3] || '').trim().toUpperCase() === 'TAK',
            }));
    }

    function parseExpenses(sheet) {
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const summary = {
            zbiorka: Number(rows[1] && rows[1][5]) || 0,
            koszty: Number(rows[1] && rows[1][6]) || 0,
            zostalo: Number(rows[1] && rows[1][7]) || 0,
        };
        const items = rows.slice(4)
            .filter(r => r[5] && r[6])
            .map(r => ({ lp: r[5], kwota: Number(r[6]) || 0, tytul: String(r[7] || '') }));
        return { summary, items };
    }

    function renderExpenses(section, expenses) {
        const { summary, items } = expenses;

        const sumDiv = document.createElement('div');
        sumDiv.className = 'expenses-summary';
        sumDiv.innerHTML = `<span>Zbiórka: <strong>${summary.zbiorka} zł</strong></span>`
            + `<span>Koszty: <strong>${summary.koszty} zł</strong></span>`
            + `<span>Zostało: <strong>${summary.zostalo} zł</strong></span>`;
        section.appendChild(sumDiv);

        if (!items.length) return;
        const table = document.createElement('table');
        table.className = 'expenses';
        table.innerHTML = '<thead><tr><th class="num">Lp</th><th class="num">Kwota</th><th>Tytuł</th></tr></thead>';
        const tbody = document.createElement('tbody');
        items.forEach(it => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="num">${it.lp}</td><td class="num">${it.kwota} zł</td><td>${it.tytul}</td>`;
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        section.appendChild(table);
    }

    function colorFor(flag) {
        if (flag === 'TAK') return 'green';
        if (flag === 'NIE') return 'red';
        return 'blue';
    }

    function drawOverlay(svg, rects, sheetData) {
        rects.forEach(r => {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            rect.setAttribute('x', r.x);
            rect.setAttribute('y', r.y);
            rect.setAttribute('width', r.w);
            rect.setAttribute('height', r.h);
            const entry = sheetData.find(s => s.addr === r.addr);
            const color = colorFor(entry ? entry.flag : '');
            rect.setAttribute('class', 'rect ' + color);
            text.setAttribute('x', r.x + 1);
            text.setAttribute('y', r.y + 12);
            text.setAttribute('class', 'label');
            text.textContent = r.addr;
            svg.appendChild(rect);
            svg.appendChild(text);
        });
    }

    function renderProgressBar(section, rects, sheetData) {
        const total = rects.length;
        if (!total) return;
        const counts = { green: 0, red: 0, blue: 0 };
        rects.forEach(r => {
            const entry = sheetData.find(s => s.addr === r.addr);
            counts[colorFor(entry ? entry.flag : '')]++;
        });
        const keys = ['green', 'red', 'blue'];
        const raw = keys.map(k => counts[k] / total * 100);
        const floored = raw.map(v => Math.floor(v * 100) / 100);
        const remainder = keys.map((_, i) => raw[i] - floored[i]);
        let diff = Math.round((100 - floored.reduce((a, b) => a + b, 0)) * 100);
        const order = keys.map((_, i) => i).sort((a, b) => remainder[b] - remainder[a]);
        for (const i of order) {
            if (diff <= 0) break;
            floored[i] = Math.round((floored[i] + 0.01) * 100) / 100;
            diff--;
        }
        const pcts = {};
        keys.forEach((k, i) => pcts[k] = floored[i]);

        const legend = document.createElement('div');
        legend.className = 'progress-legend';
        legend.innerHTML = [
            ['green', 'TAK', pcts.green],
            ['red', 'NIE', pcts.red],
            ['blue', 'Brak danych', pcts.blue],
        ].map(([c, label, p]) => `<span><i style="background:var(--${c})"></i>${label}: ${counts[c]} (${p.toFixed(2)}%)</span>`).join('');
        section.appendChild(legend);

        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        ['green', 'red', 'blue'].forEach(c => {
            const p = pcts[c];
            if (!p) return;
            const seg = document.createElement('span');
            seg.className = 'bg-' + c;
            seg.style.width = p + '%';
            seg.textContent = p >= 8 ? p + '%' : '';
            bar.appendChild(seg);
        });
        section.appendChild(bar);
    }

    function renderMap(container, mapDef, rects, sheetData, dataSheet) {
        const section = document.createElement('div');
        section.className = 'map-section';

        const h2 = document.createElement('h2');
        h2.textContent = mapDef.title;
        section.appendChild(h2);

        if (mapDef.description) {
            const p = document.createElement('p');
            p.textContent = mapDef.description;
            section.appendChild(p);
        }

        renderProgressBar(section, rects, sheetData);

        const imgContainer = document.createElement('div');
        imgContainer.className = 'image-container';

        const img = document.createElement('img');
        img.src = 'background.png';

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        imgContainer.appendChild(img);
        imgContainer.appendChild(svg);
        section.appendChild(imgContainer);

        if (mapDef.wydatki) {
            const expenses = parseExpenses(dataSheet);
            renderExpenses(section, expenses);
        }

        container.appendChild(section);

        img.addEventListener('load', () => {
            svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
            drawOverlay(svg, rects, sheetData);
        });
        if (img.complete) {
            svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
            drawOverlay(svg, rects, sheetData);
        }
    }

    async function init() {
        const container = document.getElementById('maps');

        const [xlsxRes, mappingRes] = await Promise.all([
            fetch(sheetURL('xlsx'), { redirect: 'follow' }),
            fetch('mapping.json', { cache: 'no-store' }),
        ]);

        if (!xlsxRes.ok) throw new Error('Failed to fetch spreadsheet');
        if (!mappingRes.ok) throw new Error('mapping.json not found');

        const [xlsxBuf, mappingObj] = await Promise.all([
            xlsxRes.arrayBuffer(),
            mappingRes.json(),
        ]);

        const workbook = XLSX.read(xlsxBuf, { type: 'array' });
        const rects = Array.isArray(mappingObj.rects) ? mappingObj.rects : [];

        const indexSheet = workbook.Sheets['Index'];
        if (!indexSheet) throw new Error('No "Index" sheet found in spreadsheet');

        const maps = parseIndex(indexSheet);
        container.innerHTML = '';

        for (const mapDef of maps) {
            const dataSheet = workbook.Sheets[mapDef.sheet];
            if (!dataSheet) {
                const err = document.createElement('p');
                err.className = 'error';
                err.textContent = `Sheet "${mapDef.sheet}" not found`;
                container.appendChild(err);
                continue;
            }
            const sheetData = parseSheetData(dataSheet);
            renderMap(container, mapDef, rects, sheetData, dataSheet);
        }

        if (maps.length === 0) {
            container.innerHTML = '<p class="loading">No maps found in Index sheet.</p>';
        }
    }

    init().catch(e => {
        document.getElementById('maps').innerHTML = `<p class="error">${e.message}</p>`;
    });
</script>
</body>
</html>
